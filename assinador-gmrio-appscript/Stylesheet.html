<style>
  :root {
    --rio: #00558c;
    --ink: #17324d;
    --muted: #64788a;
    --line: #dbe5eb;
    --danger: #a61b1b;
    --success: #16734a;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #edf3f6; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
  button, input { font: inherit; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid #5bb8e6; outline-offset: 2px; }

  .top {
    padding: 20px 5vw;
    display: flex;
    align-items: center;
    gap: 16px;
    color: #fff;
    background: linear-gradient(115deg, #004b7f, #006aa2);
  }
  .rio-mark { width: 56px; height: 56px; display: grid; place-items: center; border: 1px solid #ffffff66; border-radius: 13px; font-size: 20px; font-weight: 700; }
  .top h1 { margin: 0; font-size: 30px; }
  .top p { margin: 4px 0 0; color: #c6e6f7; font-size: 12px; }
  .badge { margin-left: auto; max-width: 330px; padding: 8px 12px; overflow: hidden; border: 1px solid #ffffff44; border-radius: 99px; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }

  .layout { width: min(1400px, calc(100% - 40px)); margin: 26px auto; display: grid; grid-template-columns: 1.05fr .95fr; gap: 22px; align-items: start; }
  .card { background: #fff; border: 1px solid #dce7ed; border-radius: 14px; box-shadow: 0 8px 28px #17324d0b; }
  .editor { padding: 24px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; background: #eef4f7; border-radius: 10px; }
  .tabs button { height: 42px; border: 0; border-radius: 7px; background: transparent; color: #627684; font-weight: 700; cursor: pointer; }
  .tabs button.on { color: var(--rio); background: #fff; box-shadow: 0 2px 7px #17324d15; }

  .intro { margin: 22px 0 0; padding-bottom: 18px; border-bottom: 1px solid #e4ecef; }
  .intro h2 { margin: 0; font-size: 18px; }
  .intro p, .section-help { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 19px; }
  .nested-grid { margin-top: 0; }
  .full { grid-column: 1 / -1; }
  label { display: flex; flex-direction: column; gap: 6px; color: #435a6c; font-size: 11px; font-weight: 700; }
  input { height: 39px; min-width: 0; padding: 0 10px; border: 1px solid #ccd9e0; border-radius: 7px; background: #fbfdfe; color: var(--ink); outline: none; }
  input:focus { border-color: #1683ba; box-shadow: 0 0 0 3px #1683ba18; }
  input.invalid { border-color: #c04444; box-shadow: 0 0 0 3px #c0444418; }
  input[type="color"] { width: 100%; padding: 4px; }
  .hint { color: #718493; font-size: 10px; font-weight: 400; line-height: 1.4; }
  .subtitle { display: block; margin-bottom: 8px; color: #577080; font-size: 10px; font-weight: 800; letter-spacing: .7px; text-transform: uppercase; }

  .presets { margin-top: 16px; padding: 13px; border: 1px solid #d5e5ed; border-radius: 9px; background: #f4f9fb; }
  .presets > span { display: block; margin-bottom: 8px; color: #577080; font-size: 10px; font-weight: 800; letter-spacing: .7px; text-transform: uppercase; }
  .preset-buttons { display: flex; flex-wrap: wrap; gap: 7px; }
  .preset-buttons button { padding: 8px 10px; border: 1px solid #bdd4df; border-radius: 7px; background: #fff; color: var(--rio); font-size: 11px; font-weight: 700; cursor: pointer; }

  .phone-group { padding: 14px; border: 1px solid #dfe9ee; border-radius: 9px; background: #f9fcfd; }
  .phone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .phone-card { display: grid; gap: 11px; padding: 12px; border: 1px solid #e0e9ee; border-radius: 8px; background: #fff; }
  .phone-prefix { display: grid; grid-template-columns: auto 1fr; align-items: center; border: 1px solid #ccd9e0; border-radius: 7px; overflow: hidden; background: #fbfdfe; }
  .phone-prefix:focus-within { border-color: #1683ba; box-shadow: 0 0 0 3px #1683ba18; }
  .phone-prefix strong { padding-left: 10px; color: #405a6a; font-size: 12px; white-space: nowrap; }
  .phone-prefix input { border: 0; box-shadow: none !important; }

  details { margin-top: 20px; padding-top: 17px; border-top: 1px solid #e4ecef; }
  summary { cursor: pointer; color: var(--rio); font-size: 12px; font-weight: 800; text-transform: uppercase; }
  .gm-identity { min-height: 110px; display: flex; align-items: center; gap: 18px; padding: 14px; border: 1px solid #bdd4df; border-radius: 9px; background: #f1f8fb; }
  .gm-identity img { width: 58px; height: 88px; object-fit: contain; }
  .gm-identity strong, .gm-identity span { display: block; }
  .gm-identity span { margin-top: 5px; color: var(--muted); font-size: 11px; }

  .socials { display: grid; gap: 10px; margin-top: 14px; }
  .social { display: grid; grid-template-columns: 20px 28px 82px minmax(0, 1fr); gap: 8px; align-items: center; padding: 9px; border: 1px solid #e0e9ee; border-radius: 8px; background: #fbfdfe; }
  .social input[type="checkbox"] { width: 15px; height: 15px; }
  .social img { width: 24px; height: 24px; }
  .social strong { font-size: 11px; }
  .social label { gap: 3px; }
  .social label span { color: #718493; font-size: 9px; }
  .social input[type="url"] { height: 34px; font-size: 11px; }

  .preview { position: sticky; top: 18px; overflow: hidden; }
  .preview-head { padding: 21px 24px 15px; }
  .preview-head h2 { margin: 3px 0 0; font-size: 18px; }
  .preview-head p { margin: 7px 0 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
  .canvas { margin: 0 15px; padding: 28px 18px; min-height: 300px; display: grid; align-content: center; overflow: auto; border: 1px solid #e0e9ee; border-radius: 9px; background: #fbfcfd; }
  .signature { width: max-content; max-width: 100%; margin: auto; padding: 17px; background: #fff; border: 1px solid #edf1f3; box-shadow: 0 6px 20px #17324d0d; user-select: none; -webkit-user-select: none; }
  .signature img { pointer-events: none; }
  .controls { display: flex; gap: 16px; padding: 13px 24px 0; }
  .controls label { flex-direction: row; align-items: center; font-weight: 400; }
  .controls input { width: 15px; height: 15px; }
  .copy { width: calc(100% - 48px); height: 49px; margin: 15px 24px 9px; border: 0; border-radius: 8px; background: var(--rio); color: #fff; font-weight: 700; cursor: pointer; }
  .copy:disabled { cursor: wait; opacity: .55; }
  .note { margin: 0 24px 12px; text-align: center; color: #748590; font-size: 10px; }
  .validation-summary { min-height: 20px; margin: 0 24px 18px; color: var(--danger); text-align: center; font-size: 11px; }

  .toast { position: fixed; right: 20px; bottom: 20px; z-index: 30; max-width: 380px; padding: 12px 15px; transform: translateY(20px); border-radius: 8px; background: #17324d; color: #fff; box-shadow: 0 12px 35px #0004; font-size: 12px; opacity: 0; pointer-events: none; transition: .2s ease; }
  .toast.show { transform: translateY(0); opacity: 1; }

  .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: #0b2538aa; backdrop-filter: blur(3px); }
  .modal-panel { width: min(480px, 100%); padding: 30px; border-radius: 14px; background: #fff; text-align: center; box-shadow: 0 25px 80px #00162466; }
  .modal-panel h2 { margin: 18px 0 8px; font-size: 21px; }
  .modal-panel p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .spinner { width: 44px; height: 44px; margin: auto; border: 4px solid #dceaf1; border-top-color: var(--rio); border-radius: 50%; animation: spin .8s linear infinite; }
  .modal-icon { width: 48px; height: 48px; margin: auto; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--success); font-size: 24px; font-weight: 700; }
  .modal-icon.error { background: var(--danger); }
  .record-id { margin-top: 14px !important; padding: 9px; border-radius: 6px; background: #eef5f8; color: #435a6c !important; font-family: Consolas, monospace; font-size: 10px !important; word-break: break-all; }
  .modal-actions { display: flex; justify-content: center; gap: 9px; margin-top: 20px; }
  .primary-button, .secondary-button { min-height: 40px; padding: 0 16px; border-radius: 7px; font-weight: 700; cursor: pointer; }
  .primary-button { border: 0; background: var(--rio); color: #fff; }
  .secondary-button { border: 1px solid #9cb9c8; background: #fff; color: var(--rio); }

  .hide { display: none !important; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; max-width: 760px; }
    .preview { position: static; }
  }
  @media (max-width: 620px) {
    .top { padding: 15px; }
    .top h1 { font-size: 23px; }
    .top p, .badge { display: none; }
    .layout { width: calc(100% - 20px); margin: 12px auto; }
    .editor { padding: 17px; }
    .grid, .phone-grid { grid-template-columns: 1fr; }
    .full { grid-column: auto; }
    .social { grid-template-columns: 20px 28px 1fr; }
    .social label { grid-column: 1 / -1; }
    .modal-panel { padding: 24px 18px; }
  }
</style>
